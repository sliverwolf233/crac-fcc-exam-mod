name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p artifacts
          cd release
          zip -r ../artifacts/CRAC-FCC-Exam-Mod.zip .
          cd ..
          zip -r artifacts/translations.zip translations/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
          body: |
            BI2XM Modified Edition CRAC/FCC Exam Simulator
            See README for usage instructions.
          draft: false
          prerelease: false
